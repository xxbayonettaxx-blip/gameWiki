<!doctype html>
<html lang="ja" data-theme="light" data-font="16">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="UNLOCKの掲示板 管理画面 — 概要・カテゴリ/スレッド・投稿モデレーション・会員・監査ログ">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Cpath d='M22 4 41 37H31L22 21 13 37H3Z' fill='%23202432'/%3E%3Cpath d='m17 32 5-9 5 9Z' fill='%236154b4'/%3E%3C/svg%3E">
  <title>掲示板管理 | UNLOCK</title>
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">管理内容へ移動</a>

  <!-- 非管理者 / 未ログイン時のアクセス遮断ゲート（セッション検証成功まで本体は非表示） -->
  <section id="admin-auth-gate" class="admin-gate-wrap" aria-labelledby="admin-gate-title">
    <div class="panel admin-gate-card">
      <div class="brand gate-brand">
        <div class="brand-mark" aria-hidden="true">U</div>
        <div>
          <strong>UNLOCK</strong>
          <span>管理コンソール v1.2.0</span>
        </div>
      </div>
      <h1 id="admin-gate-title">管理画面へのアクセス確認</h1>
      <p id="admin-gate-message" role="status" aria-live="polite">管理者セッションを確認しています...</p>
      <div class="admin-gate-actions">
        <a class="btn primary" href="./">← 掲示板へ戻る</a>
      </div>
    </div>
  </section>

  <!-- 管理者セッション検証後にのみ展開するワークスペース -->
  <div id="admin-workspace" class="shell" hidden>
    <aside class="sidebar" aria-label="管理メニュー">
      <div class="brand">
        <a class="brand-link" href="./" title="掲示板トップへ戻る">
          <div class="brand-mark" aria-hidden="true">U</div>
          <div>
            <strong>UNLOCK</strong>
            <span>攻略掲示板</span>
          </div>
        </a>
        <a class="mobile-back-link" href="./">← 掲示板</a>
      </div>

      <p class="nav-caption">ワークスペース</p>
      <nav id="navigation" role="tablist" aria-label="管理機能"></nav>

      <div class="sidebar-bottom">
        <button class="presentation-link" type="button" data-action="preferences">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#icon-settings"/></svg></span>
          <span>表示設定</span>
          <span class="icon side-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#icon-chevron"/></svg></span>
        </button>
        <a class="presentation-link back-board-link" href="./">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#icon-back"/></svg></span>
          <span>掲示板へ戻る</span>
        </a>
        <div class="demo-note">
          <span class="demo-dot" aria-hidden="true"></span>
          <div>
            <strong>ADMIN CONSOLE v1.2.0</strong>
            <small>本番API・監査ログ連携中</small>
          </div>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <header class="top">
        <div class="crumb">
          <span>管理画面</span>
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#icon-chevron"/></svg></span>
          <strong id="crumb-current">概要</strong>
        </div>

        <div class="top-actions">
          <button
            id="admin-reload-all"
            class="icon-btn"
            type="button"
            title="最新の管理データを再読込"
            aria-label="最新の管理データを再読込"
          >
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#icon-refresh"/></svg></span>
          </button>
          <button
            id="admin-theme-toggle"
            class="icon-btn theme-btn"
            type="button"
            data-action="theme"
            title="テーマを切り替える"
            aria-label="テーマを切り替える"
            aria-pressed="false"
          >
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#icon-moon"/></svg></span>
          </button>
          <button
            class="icon-btn mobile-prefs-btn"
            type="button"
            data-action="preferences"
            title="表示設定"
            aria-label="表示設定を開く"
          >
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#icon-settings"/></svg></span>
          </button>
          <span class="top-divider" aria-hidden="true"></span>
          <div id="admin-operator-badge" class="profile" hidden>
            <span id="admin-operator-avatar" class="avatar" aria-hidden="true">管</span>
            <div>
              <strong id="admin-operator-name">-</strong>
              <small>管理者</small>
            </div>
          </div>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <div id="admin-error-banner" class="error-banner" role="alert" tabindex="-1" hidden></div>
        <div id="page"></div>
      </main>
    </div>
  </div>

  <!-- 編集・作成・表示設定・非表示確認の汎用ダイアログ -->
  <dialog id="editor" aria-labelledby="dialog-title">
    <form id="editor-form">
      <div class="dialog-heading">
        <h2 id="dialog-title"></h2>
        <button id="dialog-close-btn" class="icon-btn" type="button" data-action="close" aria-label="閉じる">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#icon-close"/></svg></span>
        </button>
      </div>
      <div id="dialog-content"></div>
      <p id="dialog-error" class="form-error" role="alert"></p>
      <div class="dialog-footer">
        <button id="dialog-cancel-btn" type="button" class="btn secondary" data-action="close">キャンセル</button>
        <button type="submit" class="btn primary" id="dialog-submit">保存</button>
      </div>
    </form>
  </dialog>

  <!-- スレッド物理削除 2段階確認ダイアログ -->
  <dialog id="purge-thread-dialog" aria-labelledby="purge-dialog-title">
    <form id="purge-thread-form" method="dialog">
      <div class="dialog-heading">
        <h2 id="purge-dialog-title">スレッドの完全削除（物理削除）</h2>
        <button type="button" id="purge-dialog-close" class="icon-btn" aria-label="削除確認を閉じる">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#icon-close"/></svg></span>
        </button>
      </div>

      <div class="danger-notice">
        <p><strong>この操作は取り消せません。</strong> 選択したスレッドと配下のすべての投稿・返信がデータベースから完全に削除されます。</p>
        <dl class="purge-summary">
          <div>
            <dt>対象スレッド</dt>
            <dd id="purge-target-title">-</dd>
          </div>
          <div>
            <dt>内包投稿数（削除対象）</dt>
            <dd id="purge-target-count">-</dd>
          </div>
        </dl>
      </div>

      <p id="purge-dialog-error" class="form-error" role="alert" aria-live="assertive"></p>

      <label class="dialog-field" for="purge-confirm-input">
        <span>誤削除防止のため、上のスレッドタイトルをそのまま入力してください</span>
        <input id="purge-confirm-input" type="text" autocomplete="off" required>
      </label>

      <div class="dialog-footer">
        <button type="button" id="purge-cancel-btn" class="btn secondary">キャンセル</button>
        <button type="submit" id="purge-confirm-btn" class="btn danger">内容を確認して物理削除を実行</button>
      </div>
    </form>
  </dialog>

  <!-- 空カテゴリ削除 確認ダイアログ -->
  <dialog id="delete-category-dialog" aria-labelledby="delete-cat-title">
    <form id="delete-category-form" method="dialog">
      <div class="dialog-heading">
        <h2 id="delete-cat-title">カテゴリの削除確認</h2>
        <button type="button" id="delete-cat-close" class="icon-btn" aria-label="カテゴリ削除確認を閉じる">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#icon-close"/></svg></span>
        </button>
      </div>
      <p id="delete-cat-message" class="dialog-body-copy">-</p>
      <p id="delete-cat-error" class="form-error" role="alert"></p>
      <div class="dialog-footer">
        <button type="button" id="delete-cat-cancel" class="btn secondary">キャンセル</button>
        <button type="submit" id="delete-cat-confirm" class="btn danger">カテゴリを削除する</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- SVGアイコンスプライト（DOM生成側では <use href="#icon-..."> のみ参照し innerHTML 不使用） -->
  <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="icon-home" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/><path d="M3 9h18"/></symbol>
      <symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
      <symbol id="icon-message" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M7 9h10M7 13h6"/></symbol>
      <symbol id="icon-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m2-15a3 3 0 0 1 0 6m1 3a4 4 0 0 1 3 4v2"/></symbol>
      <symbol id="icon-log" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--panel, #fff)"/><circle cx="15" cy="12" r="2" fill="var(--panel, #fff)"/><circle cx="10" cy="18" r="2" fill="var(--panel, #fff)"/></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
      <symbol id="icon-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.3 15A8.6 8.6 0 0 1 9 3.7 8.7 8.7 0 1 0 20.3 15Z"/></symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m5 15 10-10 4 4-10 10H5v-4Zm8-8 4 4"/></symbol>
      <symbol id="icon-pin" viewBox="0 0 24 24"><path d="m9 3 8 4-3 3v4l-3 2-6-3 2-3h3l1-3-2-4Zm0 12-3 6"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5L3 9m0-5v5h5M4 13a8 8 0 0 0 14.5 4.5L21 15m0 5v-5h-5"/></symbol>
    </defs>
  </svg>
</body>
</html>
